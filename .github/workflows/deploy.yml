# Deploys every push to main to the demo URL (Stephen's Vercel project, common-ground-sepia.vercel.app).
#
# Needs ONE repository secret, added by the repo admin under Settings → Secrets and variables → Actions:
#   VERCEL_TOKEN — a Vercel access token scoped to the "common-ground12" team (vercel.com/account/tokens).
# The org and project ids below are identifiers, not secrets. Runtime env vars (PEOPLE_PROVIDER,
# DATABRICKS_*) live on the Vercel project itself, so nothing else needs to be configured here.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_gO3420H8X4Y3tvlVuB8Jum9I
      VERCEL_PROJECT_ID: prj_oJ8KM8wRSH27YQAkhGaDUtDlp6QL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
