<!-- @dsCard height=288 subtitle="Terminal Brutalist" -->
<!--
  blocks:      ink 180x288 (bleeds top+bottom) · ink-muted 270x210 · alert 150x48 · signal 120x48 (both bleed bottom) — every side a multiple of grid-pitch (30px), every corner radius-none
  arrangement: one tall slab flush to the block box's left edge, a 30px ground gutter, then a wide block with a status band beneath it — the page's own band stack turned on its side
  pattern:     plus grid at 2x grid-pitch, stroked in canvas at border-2 — this system's one texture is a panning engineering grid and its placeholder mark is an inscribed crosshair, so the grid intersection IS the motif
  scales:      pitch 60px (2 x grid-pitch 30px) · plus arm 9px · stroke border-2 · gutter 30px · corners radius-none throughout
-->
<div class="tb-root" style="padding:0">
  <svg viewBox="0 0 960 288" width="960" height="288" style="display:block;width:100%;height:auto" role="img" aria-label="Terminal Brutalist design system">
    <style>
      .c-ground { fill: var(--canvas); }
      .block    { rx: var(--radius-none); }
      .c-ink    { fill: var(--ink); }
      .c-muted  { fill: var(--ink-muted); }
      .c-alert  { fill: var(--alert); }
      .c-signal { fill: var(--signal); }
      .pattern  { fill: none; stroke: var(--canvas); stroke-width: var(--border-2); }
      .t-name   { fill: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 72px; letter-spacing: -0.03em; }
      .t-tag    { fill: var(--ink-subtle); font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em; }
    </style>

    <rect class="c-ground" x="0" y="0" width="960" height="288" />

    <rect class="block c-ink"    x="480" y="0"   width="180" height="288" />
    <rect class="block c-muted"  x="690" y="0"   width="270" height="210" />
    <rect class="block c-alert"  x="690" y="240" width="150" height="48"  />

</div>
