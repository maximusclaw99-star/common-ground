<!-- @dsCard group="Foundations" height=240 subtitle="30px engineering grid, panning one cell per 24s" -->
<div class="tb-root" style="position:relative;overflow:hidden;height:100%;min-height:240px">
  <div class="tb-grid"></div>
  <div class="tb-layer" style="padding:var(--space-32);height:100%;display:flex;flex-direction:column;justify-content:center">
    <p class="display-sm" style="margin:0 0 var(--space-16);text-transform:uppercase">Ground layer</p>
    <p class="body-sm" style="margin:0;color:var(--ink-muted);max-width:var(--copy-max)">
      The grid pans exactly one cell per cycle, so it never appears to jump. Content sits on
      <code>.tb-layer</code> above it.
    </p>
  </div>
</div>
